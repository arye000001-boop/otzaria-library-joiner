name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # כל ה-actions מקובעים ל-commit מדויק (ההערה מציינת את התג שממנו נלקח)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # גרסת Rust מקובעת בכוונה: כך clippy לא נכשל פתאום כשיוצאת גרסה חדשה עם התראות חדשות.
      # לעדכון: משנים כאן, מריצים מקומית cargo clippy ותיקונים אם צריך.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branch stable
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --release -- -D warnings

      - name: Tests (core)
        run: cargo test --locked -p joiner-core --release

      - name: Build portable exe
        run: cargo build --locked --release -p otzaria-joiner --features custom-protocol

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/otzaria-joiner.exe dist/Otzaria-Library-Joiner.exe
          (cd dist && sha256sum Otzaria-Library-Joiner.exe > Otzaria-Library-Joiner.exe.sha256)
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Otzaria-Library-Joiner
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
