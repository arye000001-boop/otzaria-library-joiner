name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests (core)
        run: cargo test -p joiner-core --release

      - name: Build portable exe
        run: cargo build --release -p otzaria-joiner --features custom-protocol

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/otzaria-joiner.exe dist/Otzaria-Library-Joiner.exe
          (cd dist && sha256sum Otzaria-Library-Joiner.exe > Otzaria-Library-Joiner.exe.sha256)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Library-Joiner
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
