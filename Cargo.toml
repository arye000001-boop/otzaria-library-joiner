[workspace]
members = ["core", "app"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# הליבה (SHA-256 ו-zstd) נשארת מהירה; כל השאר מקומפל לגודל
[profile.release.package.joiner-core]
opt-level = 3
[profile.release.package.zstd-sys]
opt-level = 3
[profile.release.package.zstd-safe]
opt-level = 3
[profile.release.package.zstd]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
